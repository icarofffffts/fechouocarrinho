<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Google Play Store Specification: 512x512 straight square corners, Google Play applies 20% squircle mask dynamically -->
  <defs>
    <linearGradient id="bgGradPlay" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E9B49"/>
      <stop offset="100%" stop-color="#146B32"/>
    </linearGradient>
    <filter id="cartShadowPlay" x="10%" y="10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0B3E1C" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Full bleed square background -->
  <rect width="512" height="512" fill="url(#bgGradPlay)"/>
  <!-- Cart inside 384x384 keyline safe zone (64px margin on all sides) -->
  <g transform="translate(64, 64) scale(9.6)" filter="url(#cartShadowPlay)">
    <path d="M7.5 9.8H10C12 9.8 13.6 11.1 14 13L14.4 14.8H26.5C27.2 14.8 27.8 15.1 28.3 15.6L33.2 20.2C33.8 20.8 33.8 21.7 33.2 22.3L28.3 26.9C27.8 27.4 27.2 27.7 26.5 27.7H16.4C14.8 27.7 13.5 26.6 13.2 25.1L10.9 14.4C10.7 13.6 10.3 13.1 9.5 13.1H7.5C6.5 13.1 5.7 12.4 5.7 11.4C5.7 10.5 6.5 9.8 7.5 9.8Z" fill="white"/>
    <path d="M15.5 20.7L18.2 23.3L23 18.2" stroke="#1B8C42" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28.4" cy="21.25" r="1.65" fill="#FF6B00"/>
    <circle cx="17" cy="31.15" r="1.8" fill="white"/>
    <circle cx="25.6" cy="31.15" r="1.8" fill="white"/>
  </g>
</svg>
