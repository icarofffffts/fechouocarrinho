  <!-- Info -->
  <rect x="20" y="632" width="350" height="60" rx="18" fill="#FF6B00" fill-opacity="0.1" stroke="#FF6B00" stroke-width="1.5"/>
  <g transform="translate(40,648)">
    <circle cx="8" cy="8" r="8" fill="#FF6B00"/>
    <path d="M8 4 V9 M8 12 V12.5" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>
  <text x="60" y="658" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#FF6B00">Dica</text>
  <text x="40" y="678" font-family="Inter, sans-serif" font-size="11" fill="#111827">O mercado selecionado será usado para comparar preços.</text>

  <!-- CTA -->
  <rect x="20" y="708" width="350" height="52" rx="26" fill="#1B8C42"/>
  <text x="195" y="740" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">Confirmar mercado</text>
</svg>