    <path d="M6 12 L10 16 L18 8" stroke="#1B8C42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- EPA -->
  <rect x="20" y="364" width="350" height="76" rx="20" fill="white" filter="url(#smCard)"/>
  <g transform="translate(36,382)">
