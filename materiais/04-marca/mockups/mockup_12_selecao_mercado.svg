  </g>
  <text x="56" y="76" font-family="Nunito, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5" fill="#111827">Selecionar mercado</text>
  <text x="56" y="96" font-family="Inter, sans-serif" font-size="12" fill="#6B7280">Escolha sua cidade e rede preferida</text>

  <!-- City selector -->
  <text x="24" y="132" font-family="Nunito, sans-serif" font-size="16" font-weight="800" fill="#111827">sua cidade</text>
  <rect x="20" y="148" width="350" height="56" rx="18" fill="white" filter="url(#smCard)"/>
  <g transform="translate(36,164)">
    <circle cx="12" cy="12" r="10" fill="#1B8C42" fill-opacity="0.12"/>
    <g transform="translate(6,6)">
      <path d="M6 0 C3 0 0 3 0 7 C0 12 6 18 6 18 C6 18 12 12 12 7 C12 3 9 0 6 0 Z" fill="#1B8C42"/>
