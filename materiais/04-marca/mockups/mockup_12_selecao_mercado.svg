  <text x="92" y="480" font-family="Nunito, sans-serif" font-size="16" font-weight="800" fill="#111827">Mart Minas</text>
  <text x="92" y="500" font-family="Inter, sans-serif" font-size="12" fill="#6B7280">3,1 km · 5 lojas na região</text>
  <g transform="translate(338,480)">
    <circle cx="12" cy="12" r="12" fill="#EAE5DC"/>
  </g>

  <!-- Carrefour -->
  <rect x="20" y="540" width="350" height="76" rx="20" fill="white" filter="url(#smCard)"/>
  <g transform="translate(36,558)">
    <rect width="44" height="44" rx="12" fill="#6B7280" fill-opacity="0.12"/>
    <g transform="translate(10,10)">
      <path d="M10 0 L20 6 L20 20 L0 20 L0 6 Z" fill="#6B7280"/>
      <rect x="7" y="11" width="6" height="9" fill="white"/>
    </g>
  </g>
  <text x="92" y="568" font-family="Nunito, sans-serif" font-size="16" font-weight="800" fill="#111827">Carrefour</text>
  <text x="92" y="588" font-family="Inter, sans-serif" font-size="12" fill="#6B7280">4,2 km · 3 lojas na região</text>
  <g transform="translate(338,568)">
    <circle cx="12" cy="12" r="12" fill="#EAE5DC"/>
