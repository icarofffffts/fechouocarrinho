  <text x="92" y="296" font-family="Nunito, sans-serif" font-size="16" font-weight="800" fill="white">Supermercados BH</text>
  <text x="92" y="316" font-family="Inter, sans-serif" font-size="12" fill="white" fill-opacity="0.8">2,4 km · 12 lojas na região</text>
  <rect x="92" y="326" width="90" height="18" rx="9" fill="white"/>
  <text x="100" y="339" font-family="monospace" font-size="9" font-weight="700" fill="#1B8C42">SELECIONADO</text>
  <g transform="translate(338,298)">
