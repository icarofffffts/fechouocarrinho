  <text x="92" y="412" font-family="Inter, sans-serif" font-size="12" fill="#6B7280">1,8 km · 8 lojas na região</text>
  <g transform="translate(338,392)">
    <circle cx="12" cy="12" r="12" fill="#EAE5DC"/>
  </g>

  <!-- Mart Minas -->
  <rect x="20" y="452" width="350" height="76" rx="20" fill="white" filter="url(#smCard)"/>
  <g transform="translate(36,470)">
    <rect width="44" height="44" rx="12" fill="#6B7280" fill-opacity="0.12"/>
    <g transform="translate(10,10)">
      <path d="M10 0 L20 6 L20 20 L0 20 L0 6 Z" fill="#6B7280"/>
      <rect x="7" y="11" width="6" height="9" fill="white"/>
