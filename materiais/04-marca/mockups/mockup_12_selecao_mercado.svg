  </g>
  <text x="72" y="176" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827">Belo Horizonte · MG</text>
  <text x="72" y="194" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">Minas Gerais, Brasil</text>
  <g transform="translate(338,166)">
    <path d="M0 4 L6 10 L0 16" stroke="#6B7280" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Market list -->
  <text x="24" y="232" font-family="Nunito, sans-serif" font-size="16" font-weight="800" fill="#111827">redes disponíveis</text>
  <text x="24" y="250" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">4 supermercados na sua região</text>

  <!-- BH selected -->
  <rect x="20" y="268" width="350" height="84" rx="20" fill="#1B8C42" filter="url(#smCard)"/>
  <g transform="translate(36,288)">
    <rect width="44" height="44" rx="12" fill="white" fill-opacity="0.2"/>
    <g transform="translate(10,10)">
      <path d="M10 0 L20 6 L20 20 L0 20 L0 6 Z" fill="white"/>
      <rect x="7" y="11" width="6" height="9" fill="#1B8C42"/>
