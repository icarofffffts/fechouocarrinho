<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="amBg" x1="0" y1="0" x2="0" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
    <filter id="amSheet" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-6" std-deviation="14" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Dimmed background (home blurred) -->
  <rect width="390" height="844" fill="url(#amBg)"/>
  <rect width="390" height="844" fill="#111827" fill-opacity="0.45"/>

  <!-- Status bar (light) -->
  <text x="24" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="white">9:41</text>
  <g transform="translate(300,14)">
    <rect x="0" y="2" width="18" height="10" rx="2" fill="none" stroke="white" stroke-width="1.2"/>
    <rect x="2" y="4" width="12" height="6" rx="1" fill="white"/>
    <rect x="18" y="5" width="2" height="4" rx="1" fill="white"/>
  </g>
  <g transform="translate(326,14)">
    <path d="M0 12 L4 8 L8 10 L12 6 L16 4" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(348,14)">
    <rect x="0" y="4" width="3" height="8" rx="1" fill="white"/>
    <rect x="5" y="2" width="3" height="10" rx="1" fill="white"/>
    <rect x="10" y="0" width="3" height="12" rx="1" fill="white"/>
  </g>

  <!-- Bottom sheet -->
  <g filter="url(#amSheet)">
    <rect y="200" width="390" height="644" rx="32" fill="white"/>
  </g>
  <rect x="175" y="212" width="40" height="4" rx="2" fill="#EAE5DC"/>

  <!-- Header -->
  <g transform="translate(20,232)">
    <circle cx="16" cy="16" r="16" fill="#1B8C42" fill-opacity="0.12"/>
    <line x1="10" y1="10" x2="22" y2="22" stroke="#1B8C42" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="10" x2="10" y2="22" stroke="#1B8C42" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="56" y="252" font-family="Nunito, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5" fill="#111827">Adicionar item manualmente</text>
  <text x="56" y="272" font-family="Inter, sans-serif" font-size="12" fill="#6B7280">Cadastre um produto sem usar a câmera</text>

  <!-- Name field -->
  <text x="32" y="312" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280">Nome do produto</text>
  <rect x="32" y="322" width="326" height="50" rx="14" fill="#FFF8F0" stroke="#111827" stroke-opacity="0.12" stroke-width="1.5"/>
  <text x="48" y="353" font-family="Inter, sans-serif" font-size="14" fill="#111827">Arroz integral 5kg</text>
  <g transform="translate(332,336)">
    <path d="M0 0 L8 8 L0 16" stroke="#6B7280" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Category chips -->
  <text x="32" y="396" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280">Categoria</text>
  <g transform="translate(32,406)">
    <rect width="92" height="32" rx="16" fill="#1B8C42"/>
    <text x="46" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">Mercearia</text>
  </g>
  <g transform="translate(132,406)">
    <rect width="96" height="32" rx="16" fill="#EAE5DC"/>
    <text x="48" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280" text-anchor="middle">Laticínios</text>
  </g>
  <g transform="translate(236,406)">
    <rect width="86" height="32" rx="16" fill="#EAE5DC"/>
    <text x="43" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280" text-anchor="middle">Bebidas</text>
  </g>
  <g transform="translate(32,446)">
    <rect width="80" height="32" rx="16" fill="#EAE5DC"/>
    <text x="40" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280" text-anchor="middle">Hortifruti</text>
  </g>
  <g transform="translate(120,446)">
    <rect width="74" height="32" rx="16" fill="#EAE5DC"/>
    <text x="37" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280" text-anchor="middle">Carnes</text>
  </g>

  <!-- Price field -->
  <text x="32" y="500" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280">Preço unitário</text>
  <rect x="32" y="510" width="326" height="50" rx="14" fill="#FFF8F0" stroke="#111827" stroke-opacity="0.12" stroke-width="1.5"/>
  <text x="48" y="541" font-family="Nunito, sans-serif" font-size="18" font-weight="800" fill="#111827">R$ 28,90</text>
  <text x="340" y="541" font-family="Inter, sans-serif" font-size="11" fill="#6B7280" text-anchor="end">editar</text>

  <!-- Quantity -->
  <text x="32" y="584" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280">Quantidade</text>
  <g transform="translate(32,594)">
    <rect width="52" height="46" rx="14" fill="#EAE5DC"/>
    <line x1="16" y1="23" x2="36" y2="23" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  </g>
  <rect x="92" y="594" width="70" height="46" rx="14" fill="white" stroke="#111827" stroke-opacity="0.12" stroke-width="1.5"/>
  <text x="127" y="624" font-family="Nunito, sans-serif" font-size="20" font-weight="800" fill="#111827" text-anchor="middle">1</text>
  <g transform="translate(170,594)">
    <rect width="52" height="46" rx="14" fill="#1B8C42"/>
    <line x1="16" y1="23" x2="36" y2="23" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="13" x2="26" y2="33" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(236,606)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">total do item</text>
    <text x="0" y="22" font-family="Nunito, sans-serif" font-size="20" font-weight="800" fill="#111827">R$ 28,90</text>
  </g>

  <!-- Buttons -->
  <rect x="32" y="660" width="156" height="50" rx="25" fill="#EAE5DC"/>
  <text x="110" y="691" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Cancelar</text>

  <rect x="202" y="660" width="156" height="50" rx="25" fill="#FF6B00"/>
  <g transform="translate(236,674)">
    <path d="M2 8 L7 13 L14 5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="280" y="691" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">Adicionar</text>

  <!-- Footer hint -->
  <text x="195" y="732" font-family="Inter, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">O item será salvo na lista selecionada</text>
</svg>