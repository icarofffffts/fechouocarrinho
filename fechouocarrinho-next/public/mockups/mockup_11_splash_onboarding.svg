<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="390" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B8C42"/>
      <stop offset="60%" stop-color="#146B32"/>
      <stop offset="100%" stop-color="#0E4822"/>
    </linearGradient>
    <filter id="spGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" std-deviation="20" flood-color="#0B3E1C" flood-opacity="0.35"/>
    </filter>
    <filter id="spBtn" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" std-deviation="12" flood-color="#FF6B00" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="390" height="844" fill="url(#spBg)"/>

  <!-- decorative dots -->
  <g fill="white" fill-opacity="0.12">
    <circle cx="40" cy="120" r="2"/>
    <circle cx="350" cy="160" r="3"/>
    <circle cx="60" cy="700" r="2"/>
    <circle cx="330" cy="650" r="3"/>
    <circle cx="100" cy="200" r="1.5"/>
    <circle cx="290" cy="720" r="1.5"/>
  </g>
  <g fill="#FF6B00" fill-opacity="0.25">
    <circle cx="80" cy="100" r="2"/>
    <circle cx="310" cy="140" r="2"/>
    <circle cx="120" cy="740" r="2"/>
  </g>

  <!-- Status bar -->
  <text x="24" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="white">9:41</text>
  <g transform="translate(300,14)">
    <rect x="0" y="2" width="18" height="10" rx="2" fill="none" stroke="white" stroke-width="1.2"/>
    <rect x="2" y="4" width="12" height="6" rx="1" fill="white"/>
    <rect x="18" y="5" width="2" height="4" rx="1" fill="white"/>
  </g>
  <g transform="translate(326,14)">
    <path d="M0 12 L4 8 L8 10 L12 6 L16 4" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(348,14)">
    <rect x="0" y="4" width="3" height="8" rx="1" fill="white"/>
    <rect x="5" y="2" width="3" height="10" rx="1" fill="white"/>
    <rect x="10" y="0" width="3" height="12" rx="1" fill="white"/>
  </g>

  <!-- Logo mark -->
  <g transform="translate(147, 120)">
    <rect width="96" height="96" rx="30" fill="white" filter="url(#spGlow)"/>
    <g transform="translate(10, 10) scale(1.9)">
      <path d="M7.5 9.8H10C12 9.8 13.6 11.1 14 13L14.4 14.8H26.5C27.2 14.8 27.8 15.1 28.3 15.6L33.2 20.2C33.8 20.8 33.8 21.7 33.2 22.3L28.3 26.9C27.8 27.4 27.2 27.7 26.5 27.7H16.4C14.8 27.7 13.5 26.6 13.2 25.1L10.9 14.4C10.7 13.6 10.3 13.1 9.5 13.1H7.5C6.5 13.1 5.7 12.4 5.7 11.4C5.7 10.5 6.5 9.8 7.5 9.8Z" fill="#1B8C42"/>
      <path d="M15.5 20.7L18.2 23.3L23 18.2" stroke="white" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="28.4" cy="21.25" r="1.65" fill="#FF6B00"/>
      <circle cx="17" cy="31.15" r="1.8" fill="#1B8C42"/>
      <circle cx="25.6" cy="31.15" r="1.8" fill="#1B8C42"/>
    </g>
  </g>
  <text x="195" y="246" font-family="Nunito, sans-serif" font-size="28" font-weight="800" letter-spacing="-1" fill="white" text-anchor="middle">fechou o carrinho</text>
  <text x="195" y="272" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="white" fill-opacity="0.85" text-anchor="middle">Seu total no mercado, sem sustos no caixa.</text>

  <!-- Illustration: cart + check + price tag -->
  <g transform="translate(95, 320)">
    <rect x="0" y="0" width="200" height="160" rx="24" fill="white" fill-opacity="0.1"/>
    <!-- cart -->
    <g transform="translate(30, 40)">
      <path d="M0 0 H8 L12 40 H72 L80 12 H16" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="24" cy="52" r="5" fill="white"/>
      <circle cx="64" cy="52" r="5" fill="white"/>
    </g>
    <!-- check badge -->
    <g transform="translate(130, 20)">
      <circle cx="30" cy="30" r="26" fill="#FF6B00"/>
      <path d="M18 30 L26 38 L42 22" stroke="white" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- price tag -->
    <g transform="translate(40, 100)">
      <rect x="0" y="0" width="60" height="30" rx="8" fill="white" fill-opacity="0.9"/>
      <text x="30" y="20" font-family="Nunito, sans-serif" font-size="14" font-weight="800" fill="#1B8C42" text-anchor="middle">R$ 189,40</text>
    </g>
  </g>

  <!-- Tagline -->
  <text x="195" y="520" font-family="Nunito, sans-serif" font-size="20" font-weight="800" fill="white" text-anchor="middle">Levou. Somou. Fechou.</text>
  <text x="195" y="548" font-family="Inter, sans-serif" font-size="13" fill="white" fill-opacity="0.8" text-anchor="middle">Registre cada etiqueta com a câmera e acompanhe</text>
  <text x="195" y="568" font-family="Inter, sans-serif" font-size="13" fill="white" fill-opacity="0.8" text-anchor="middle">o total em tempo real — funciona 100% offline.</text>

  <!-- Onboarding dots -->
  <g transform="translate(165, 600)">
    <circle cx="0" cy="0" r="4" fill="white"/>
    <circle cx="16" cy="0" r="4" fill="white" fill-opacity="0.4"/>
    <circle cx="32" cy="0" r="4" fill="white" fill-opacity="0.4"/>
    <circle cx="48" cy="0" r="4" fill="white" fill-opacity="0.4"/>
  </g>

  <!-- CTA button -->
  <rect x="40" y="640" width="310" height="56" rx="28" fill="#FF6B00" filter="url(#spBtn)"/>
  <text x="195" y="675" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">Começar Agora</text>
  <g transform="translate(300,656)">
    <path d="M0 12 L8 12 M4 8 L8 12 L4 16" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Secondary link -->
  <text x="195" y="720" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="white" fill-opacity="0.8" text-anchor="middle">Já tenho uma conta · Entrar</text>

  <!-- Footer -->
  <text x="195" y="790" font-family="Inter, sans-serif" font-size="10" fill="white" fill-opacity="0.5" text-anchor="middle">100% offline · sem cadastro obrigatório</text>
</svg>