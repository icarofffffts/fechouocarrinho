server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # APK download - Fechou o Carrinho
    location = /downloads/fechouocarrinho.apk {
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition 'attachment; filename="fechouocarrinho.apk"' always;
        add_header Cache-Control 'no-store' always;
        try_files $uri =404;
    }
    location = /downloads/fechouocarrinho-site.apk {
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition 'attachment; filename="fechouocarrinho.apk"' always;
        add_header Cache-Control 'no-store' always;
        try_files $uri =404;
    }

    # App Links - Android
    location = /.well-known/assetlinks.json {
        types { application/json json; }
        add_header Content-Type application/json always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # API proxy para Supabase (Kong) - opcional, mesma rede
    location /api/ {
        proxy_pass http://supabase-kong:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CORS para o app/web
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "apikey, Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets
    location ~* \.(css|js|png|jpg|jpeg|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
