<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="celebBg" x1="0" y1="0" x2="390" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B8C42"/>
      <stop offset="60%" stop-color="#146B32"/>
      <stop offset="100%" stop-color="#0E4822"/>
    </linearGradient>
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" std-deviation="16" flood-color="#0B3E1C" flood-opacity="0.3"/>
    </filter>
    <filter id="cardShadow3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" std-deviation="10" flood-color="#111827" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="url(#celebBg)"/>

  <!-- Confetti dots -->
  <g fill="white" fill-opacity="0.25">
    <circle cx="40" cy="120" r="3"/>
    <circle cx="350" cy="160" r="2"/>
    <circle cx="60" cy="260" r="2"/>
    <circle cx="330" cy="300" r="3"/>
    <circle cx="80" cy="420" r="2"/>
    <circle cx="310" cy="460" r="3"/>
  </g>
  <g fill="#FF6B00" fill-opacity="0.5">
    <circle cx="120" cy="100" r="2"/>
    <circle cx="270" cy="140" r="3"/>
    <circle cx="90" cy="320" r="2"/>
    <circle cx="300" cy="360" r="2"/>
  </g>

  <!-- Status bar (light) -->
  <text x="20" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="white">9:41</text>
  <g transform="translate(300, 14)">
    <rect x="0" y="2" width="18" height="10" rx="2" fill="none" stroke="white" stroke-width="1.2"/>
    <rect x="2" y="4" width="12" height="6" rx="1" fill="white"/>
    <rect x="18" y="5" width="2" height="4" rx="1" fill="white"/>
  </g>
  <g transform="translate(326, 14)">
    <path d="M0 12 L4 8 L8 10 L12 6 L16 4" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(348, 14)">
    <rect x="0" y="4" width="3" height="8" rx="1" fill="white"/>
    <rect x="5" y="2" width="3" height="10" rx="1" fill="white"/>
    <rect x="10" y="0" width="3" height="12" rx="1" fill="white"/>
  </g>

  <!-- Top close -->
  <g transform="translate(20, 56)">
    <circle cx="16" cy="16" r="16" fill="white" fill-opacity="0.12"/>
    <text x="10" y="22" font-size="16" fill="white">✕</text>
  </g>

  <!-- Celebration icon -->
  <g transform="translate(195, 150)">
    <circle cx="0" cy="0" r="52" fill="white" fill-opacity="0.15"/>
    <circle cx="0" cy="0" r="38" fill="white"/>
    <text x="0" y="14" font-size="40" text-anchor="middle">🎉</text>
  </g>

  <!-- Title -->
  <text x="195" y="230" font-family="Nunito, sans-serif" font-size="28" font-weight="800" letter-spacing="-1" fill="white" text-anchor="middle">Fechou o Carrinho!</text>
  <text x="195" y="256" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="white" fill-opacity="0.85" text-anchor="middle">Sua compra está calculada, sem sustos no caixa.</text>

  <!-- Main total card -->
  <rect x="24" y="286" width="342" height="170" rx="28" fill="white" filter="url(#cardShadow3)"/>
  <text x="44" y="316" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280">total calculado</text>
  <text x="44" y="362" font-family="Nunito, sans-serif" font-size="46" font-weight="800" letter-spacing="-2" fill="#111827">R$ 189,40</text>
  <text x="44" y="386" font-family="Inter, sans-serif" font-size="12" fill="#6B7280">12 itens · Supermercados BH</text>

  <!-- Divider -->
  <line x1="44" y1="402" x2="346" y2="402" stroke="#111827" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Savings -->
  <g transform="translate(44, 416)">
    <rect width="120" height="30" rx="15" fill="#1B8C42" fill-opacity="0.12"/>
    <text x="12" y="20" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1B8C42">economia R$ 27,60</text>
  </g>
  <text x="346" y="436" font-family="Inter, sans-serif" font-size="11" fill="#6B7280" text-anchor="end">vs. meta de R$ 200,00</text>

  <!-- Breakdown list -->
  <text x="24" y="482" font-family="Nunito, sans-serif" font-size="16" font-weight="800" fill="white">resumo da compra</text>

  <g transform="translate(24, 496)">
    <rect width="342" height="44" rx="14" fill="white" fill-opacity="0.12"/>
    <text x="16" y="28" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="white">Mercearia (6 itens)</text>
    <text x="326" y="28" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="white" text-anchor="end">R$ 98,40</text>
  </g>
  <g transform="translate(24, 548)">
    <rect width="342" height="44" rx="14" fill="white" fill-opacity="0.12"/>
    <text x="16" y="28" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="white">Laticínios (3 itens)</text>
    <text x="326" y="28" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="white" text-anchor="end">R$ 42,30</text>
  </g>
  <g transform="translate(24, 600)">
    <rect width="342" height="44" rx="14" fill="white" fill-opacity="0.12"/>
    <text x="16" y="28" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="white">Bebidas (3 itens)</text>
    <text x="326" y="28" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="white" text-anchor="end">R$ 48,70</text>
  </g>

  <!-- Buttons -->
  <rect x="24" y="670" width="164" height="52" rx="26" fill="white"/>
  <text x="106" y="702" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1B8C42" text-anchor="middle">Compartilhar</text>

  <rect x="202" y="670" width="164" height="52" rx="26" fill="#FF6B00"/>
  <text x="284" y="702" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">Finalizar</text>

  <!-- Footer note -->
  <text x="195" y="748" font-family="Inter, sans-serif" font-size="11" fill="white" fill-opacity="0.6" text-anchor="middle">Lista salva offline · pode ser reaberta a qualquer momento</text>
</svg>