  <text x="44" y="578" font-size="18">🥛</text>
  <text x="80" y="568" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827">Leite integral 1L</text>
  <text x="80" y="586" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">4 un · R$ 4,99</text>
  <text x="350" y="578" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#111827" text-anchor="end">R$ 19,96</text>

