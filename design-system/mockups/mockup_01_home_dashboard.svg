  <text x="195" y="772" font-size="20" text-anchor="middle" fill="white">📷</text>
  <text x="195" y="812" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#FF6B00" text-anchor="middle">Escanear</text>

