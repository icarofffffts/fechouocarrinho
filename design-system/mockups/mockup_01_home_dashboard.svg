  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#FFF8F0"/>

  <!-- Status bar -->
  <text x="20" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827">9:41</text>
  <g transform="translate(300, 14)">
    <rect x="0" y="2" width="18" height="10" rx="2" fill="none" stroke="#111827" stroke-width="1.2"/>
    <rect x="2" y="4" width="12" height="6" rx="1" fill="#111827"/>
    <rect x="18" y="5" width="2" height="4" rx="1" fill="#111827"/>
  </g>
  <g transform="translate(326, 14)">
