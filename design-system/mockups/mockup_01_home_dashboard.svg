  <text x="80" y="426" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">1 un · R$ 28,90</text>
  <rect x="80" y="430" width="46" height="16" rx="8" fill="#FF6B00"/>
  <text x="86" y="442" font-family="monospace" font-size="9" font-weight="700" fill="white">OCR</text>
  <text x="350" y="418" font-family="Nunito, sans-serif" font-size="15" font-weight="800" fill="#111827" text-anchor="end">R$ 28,90</text>

