  <text x="80" y="660" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827">Café torrado 500g</text>
  <text x="80" y="678" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">1 un · R$ 18,50</text>
