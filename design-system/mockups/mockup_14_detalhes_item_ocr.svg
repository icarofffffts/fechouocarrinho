<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="diBg" x1="0" y1="0" x2="0" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="diCard" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" std-deviation="10" flood-color="#111827" flood-opacity="0.1"/>
    </filter>
    <clipPath id="labelPhoto"><rect width="350" height="180" rx="16"/></clipPath>
  </defs>

  <!-- Dimmed camera background -->
  <rect width="390" height="844" fill="url(#diBg)"/>
  <rect width="390" height="844" fill="#111827" fill-opacity="0.3"/>

  <!-- Status bar (light) -->
  <text x="24" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="white">9:41</text>
  <g transform="translate(300,14)">
    <rect x="0" y="2" width="18" height="10" rx="2" fill="none" stroke="white" stroke-width="1.2"/>
    <rect x="2" y="4" width="12" height="6" rx="1" fill="white"/>
    <rect x="18" y="5" width="2" height="4" rx="1" fill="white"/>
  </g>
  <g transform="translate(326,14)">
    <path d="M0 12 L4 8 L8 10 L12 6 L16 4" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(348,14)">
    <rect x="0" y="4" width="3" height="8" rx="1" fill="white"/>
    <rect x="5" y="2" width="3" height="10" rx="1" fill="white"/>
    <rect x="10" y="0" width="3" height="12" rx="1" fill="white"/>
  </g>

  <!-- Top bar -->
  <g transform="translate(20,56)">
    <circle cx="16" cy="16" r="16" fill="white" fill-opacity="0.12"/>
    <line x1="10" y1="10" x2="22" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="10" x2="10" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="195" y="76" font-family="Nunito, sans-serif" font-size="18" font-weight="800" fill="white" text-anchor="middle">Corrigir leitura</text>
  <g transform="translate(338,56)">
    <circle cx="16" cy="16" r="16" fill="white" fill-opacity="0.12"/>
    <path d="M8 8 L24 8 L24 24 L8 24 Z" fill="none" stroke="white" stroke-width="1.6"/>
    <circle cx="16" cy="16" r="4" fill="white"/>
  </g>

  <!-- Card -->
  <rect x="20" y="104" width="350" height="620" rx="28" fill="white" filter="url(#diCard)"/>

  <!-- Label photo -->
  <g transform="translate(20,120)">
    <rect width="350" height="180" rx="16" fill="#EAE5DC"/>
    <image href="products/arroz-tio-joao.jpg" xlink:href="products/arroz-tio-joao.jpg" x="0" y="0" width="350" height="180" preserveAspectRatio="xMidYMid slice" clip-path="url(#labelPhoto)"/>
    <!-- OCR highlight -->
    <rect x="120" y="60" width="110" height="44" rx="8" fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="130" y="90" font-family="monospace" font-size="16" font-weight="700" fill="#FF6B00">R$ 28,90</text>
    <rect x="120" y="112" width="90" height="20" rx="10" fill="#FF6B00"/>
    <text x="130" y="126" font-family="monospace" font-size="9" font-weight="700" fill="white">OCR detectado</text>
  </g>

  <!-- Product info -->
  <text x="40" y="332" font-family="Nunito, sans-serif" font-size="18" font-weight="800" fill="#111827">Arroz Tio João 5kg</text>
  <text x="40" y="352" font-family="Inter, sans-serif" font-size="12" fill="#6B7280">Supermercados BH · Mercearia</text>

  <!-- Detected price editable -->
  <text x="40" y="388" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280">Preço detectado (editável)</text>
  <rect x="40" y="398" width="310" height="56" rx="14" fill="#FFF8F0" stroke="#FF6B00" stroke-width="2"/>
  <text x="56" y="434" font-family="Nunito, sans-serif" font-size="24" font-weight="800" fill="#FF6B00">R$ 28,90</text>
  <g transform="translate(318,414)">
    <path d="M0 4 L4 0 L8 4" stroke="#FF6B00" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="4" y1="0" x2="4" y2="12" stroke="#FF6B00" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Confidence -->
  <g transform="translate(40,468)">
    <rect width="150" height="24" rx="12" fill="#1B8C42" fill-opacity="0.12"/>
    <g transform="translate(10,5)">
      <path d="M2 7 L5 10 L11 4" stroke="#1B8C42" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="26" y="17" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1B8C42">confiança 94%</text>
  </g>
  <text x="200" y="484" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">Ajuste se a leitura estiver errada</text>

  <!-- Quantity -->
  <text x="40" y="520" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280">Quantidade</text>
  <g transform="translate(40,530)">
    <rect width="46" height="42" rx="12" fill="#EAE5DC"/>
    <line x1="13" y1="21" x2="33" y2="21" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  </g>
  <rect x="94" y="530" width="60" height="42" rx="12" fill="white" stroke="#111827" stroke-opacity="0.12" stroke-width="1.5"/>
  <text x="124" y="558" font-family="Nunito, sans-serif" font-size="18" font-weight="800" fill="#111827" text-anchor="middle">1</text>
  <g transform="translate(162,530)">
    <rect width="46" height="42" rx="12" fill="#1B8C42"/>
    <line x1="13" y1="21" x2="33" y2="21" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="23" y1="11" x2="23" y2="31" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(220,542)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">total do item</text>
    <text x="0" y="22" font-family="Nunito, sans-serif" font-size="20" font-weight="800" fill="#111827">R$ 28,90</text>
  </g>

  <!-- Buttons -->
  <rect x="40" y="596" width="148" height="50" rx="25" fill="#EAE5DC"/>
  <g transform="translate(74,610)">
    <line x1="0" y1="0" x2="16" y2="16" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="0" x2="0" y2="16" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="114" y="627" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle">Excluir</text>

  <rect x="202" y="596" width="148" height="50" rx="25" fill="#FF6B00"/>
  <g transform="translate(236,610)">
    <path d="M2 8 L7 13 L14 5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="276" y="627" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">Confirmar</text>

  <!-- Tip -->
  <rect x="40" y="664" width="310" height="46" rx="14" fill="#1B8C42" fill-opacity="0.1"/>
  <g transform="translate(56,676)">
    <circle cx="8" cy="8" r="8" fill="#1B8C42"/>
    <path d="M8 4 V9 M8 12 V12.5" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>
  <text x="76" y="682" font-family="Nunito, sans-serif" font-size="12" font-weight="800" fill="#1B8C42">Dica</text>
  <text x="56" y="698" font-family="Inter, sans-serif" font-size="10" fill="#111827">Toque no preço para corrigir a leitura do OCR.</text>
</svg>