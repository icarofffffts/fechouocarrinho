<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile Showcase Viewer — Fechou o Carrinho</title>
  <style>
    :root {
      --brand: #1B8C42;
      --accent: #FF6B00;
      --cream: #FFF8F0;
      --ink: #111827;
      --bg: #0F172A;
      --muted: #6B7280;
      --card: #FFFFFF;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: #E5E7EB;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(12px);
      background: rgba(15,23,42,.85);
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .brand {
      display: flex; align-items: center; gap: 12px;
    }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 10px; background: var(--brand);
      display: grid; place-items: center; color: white; font-weight: 800; font-family: "Nunito", sans-serif;
    }
    .brand h1 { margin: 0; font-size: 16px; font-weight: 700; color: #fff; }
    .brand p { margin: 0; font-size: 11px; color: rgba(255,255,255,.5); text-transform: uppercase; letter-spacing: .12em; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .toggle {
      display: inline-flex; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 999px; padding: 4px;
    }
    .toggle button {
      border: 0; background: transparent; color: rgba(255,255,255,.7); padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .toggle button.active { background: var(--brand); color: white; }
    .tabs {
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 24px 0 8px;
    }
    .tab {
      border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); color: rgba(255,255,255,.7);
      padding: 8px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .tab.active { background: var(--accent); color: white; border-color: var(--accent); }
    .stage {
      padding: 24px 16px 48px; display: flex; justify-content: center; align-items: flex-start;
    }
    .focused { display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .grid-view { display: none; }
    body.mode-grid .focused { display: none; }
    body.mode-grid .grid-view { display: block; }
    .grid-wrap {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; max-width: 1600px; margin: 0 auto; padding: 0 16px 48px;
    }
    @media (max-width: 1200px) { .grid-wrap { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .grid-wrap { grid-template-columns: 1fr; } }
    .grid-item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .grid-item .label { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.8); }
    .phone {
      width: min(320px, 82vw);
      aspect-ratio: 390 / 844;
      background: #0b0f19;
      border-radius: 40px;
      padding: 10px;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.08), inset 0 0 0 1px rgba(0,0,0,.4);
      position: relative;
      transition: transform .3s ease;
    }
    .phone:hover { transform: translateY(-4px); }
    .phone::before {
      content: ""; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 38%; height: 26px; background: #000; border-radius: 0 0 18px 18px; z-index: 3;
    }
    .phone::after {
      content: ""; position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      width: 34%; height: 4px; background: rgba(255,255,255,.25); border-radius: 999px; z-index: 3;
    }
    .screen {
      width: 100%; height: 100%; border-radius: 32px; overflow: hidden; background: var(--cream);
      position: relative;
    }
    .screen svg { width: 100%; height: 100%; display: block; }
    .status-pill {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.4); z-index: 4;
    }
    .focused .phone { width: min(360px, 86vw); }
    .caption {
      text-align: center; color: rgba(255,255,255,.6); font-size: 13px; max-width: 420px;
    }
    .caption strong { color: #fff; }
    .footer-note {
      text-align: center; padding: 24px; color: rgba(255,255,255,.35); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
      background: rgba(27,140,66,.18); color: #6EE7A0; font-size: 11px; font-weight: 600;
    }
    .badge.accent { background: rgba(255,107,0,.18); color: #FFB380; }
  </style>

</head>

    <div class="controls">

<script>
    const SCREENS = [
      { id: "home", label: "Home / Lista", file: "mockup_01_home_dashboard.svg", title: "Home / Lista de Compras", desc: "Lista de compras com orçamento, categorias e total em tempo real." },
      { id: "scanner", label: "Scanner OCR", file: "mockup_02_scanner_ocr.svg", title: "Scanner OCR de Gôndola", desc: "Leitura instantânea de etiquetas de preço, 100% offline." },
      { id: "total", label: "Total sem Sustos", file: "mockup_03_carrinho_fechado.svg", title: "Total sem Sustos (Carrinho Fechado)", desc: "Resumo final da compra com economia e compartilhamento." },
      { id: "compare", label: "Comparador", file: "mockup_04_comparador_mercados.svg", title: "Comparador de Supermercados", desc: "Compare preços do mesmo item em diferentes mercados." },
      { id: "widgets", label: "Widgets Android", file: "mockup_05_widgets_android.svg", title: "Widgets Android", desc: "Widgets de home screen: total, lista e atalho de scanner." },
    ];

    // Inline high-fidelity fallback SVGs (from <template> tags)
    const INLINE = {
      home: document.getElementById('tpl-home').innerHTML,
      scanner: document.getElementById('tpl-scanner').innerHTML,
      total: document.getElementById('tpl-total').innerHTML,
      compare: document.getElementById('tpl-compare').innerHTML,
      widgets: document.getElementById('tpl-widgets').innerHTML,
    };

    const screens = SCREENS.map((s, i) => ({ ...s, index: i }));

    let current = 0;
    let mode = 'focused';

    function phoneHTML(screenIdx, sizeClass) {
      const s = SCREENS[screenIdx];
      return `<div class="phone ${sizeClass||''}" data-screen="${s.id}">
        <div class="screen" id="screen-${s.id}-${screenIdx}"></div>
      </div>`;
    }

    function loadScreenInto(containerId, screenIdx) {
      const s = SCREENS[screenIdx];
      const el = document.getElementById(containerId);
      if (!el) return;
      // immediate inline fallback
      el.innerHTML = INLINE[s.id] || '';
      // try external
      fetch(s.file).then(r => { if (!r.ok) throw new Error('not found'); return r.text(); })
        .then(txt => { if (txt && txt.includes('<svg')) el.innerHTML = txt; })
        .catch(() => { /* keep inline */ });
    }

    function renderFocused() {
      loadScreenInto('focusedScreen', current);
      // tabs
      const tabs = document.getElementById('focusedTabs');
      tabs.innerHTML = SCREENS.map((s, i) => `<button class="tab ${i===current?'active':''}" data-i="${i}" type="button">${s.label}</button>`).join('');
      tabs.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
        current = +b.dataset.i; renderFocused();
      }));
      const cap = document.getElementById('focusedCaption');
      const s = SCREENS[current];
      cap.innerHTML = `<strong>${s.title}</strong><br/>${s.desc}`;
    }

    function renderGrid() {
      const wrap = document.getElementById('gridWrap');
      wrap.innerHTML = SCREENS.map((s, i) => `
        <div class="grid-item">
          <div class="phone" data-screen="${s.id}">
            <div class="screen" id="gscreen-${i}"></div>
          </div>
          <div class="label">${s.label}</div>
        </div>`).join('');
      SCREENS.forEach((s, i) => loadScreenInto(`gscreen-${i}`, i));
    }

    // mode toggle
    document.getElementById('btnFocused').addEventListener('click', () => {
      mode = 'focused';
      document.body.classList.remove('mode-grid');
      document.body.classList.add('mode-focused');
      document.getElementById('btnFocused').classList.add('active');
      document.getElementById('btnGrid').classList.remove('active');
      renderFocused();
    });
    document.getElementById('btnGrid').addEventListener('click', () => {
      mode = 'grid';
      document.body.classList.remove('mode-focused');
      document.body.classList.add('mode-grid');
      document.getElementById('btnGrid').classList.add('active');
      document.getElementById('btnFocused').classList.remove('active');
      renderGrid();
    });

    // init
    document.body.classList.add('mode-focused');
    renderFocused();
  </script>
