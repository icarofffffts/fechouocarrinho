<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile Showcase Viewer — Fechou o Carrinho</title>
  <style>
    :root {
      --brand: #1B8C42;
      --accent: #FF6B00;
      --cream: #FFF8F0;
      --ink: #111827;
      --bg: #0F172A;
      --muted: #6B7280;
      --card: #FFFFFF;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: #E5E7EB;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(12px);
      background: rgba(15,23,42,.88);
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 10px; background: var(--brand);
      display: grid; place-items: center; color: white; font-weight: 800; font-family: "Nunito", sans-serif;
    }
    .brand h1 { margin: 0; font-size: 16px; font-weight: 700; color: #fff; }
    .brand p { margin: 0; font-size: 11px; color: rgba(255,255,255,.5); text-transform: uppercase; letter-spacing: .12em; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .toggle {
      display: inline-flex; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 999px; padding: 4px;
    }
    .toggle button {
      border: 0; background: transparent; color: rgba(255,255,255,.7); padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .toggle button.active { background: var(--brand); color: white; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
      background: rgba(27,140,66,.18); color: #6EE7A0; font-size: 11px; font-weight: 600;
    }
    .badge.accent { background: rgba(255,107,0,.18); color: #FFB380; }

    .filters {
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 16px 16px 4px;
    }
    .pill {
      border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); color: rgba(255,255,255,.75);
      padding: 8px 16px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s; white-space: nowrap;
    }
    .pill.active { background: var(--accent); color: white; border-color: var(--accent); }

    .tabs-wrap {
      width: 100%; overflow-x: auto; scrollbar-width: thin; padding: 8px 16px 12px;
      -webkit-overflow-scrolling: touch;
    }
    .tabs-wrap::-webkit-scrollbar { height: 6px; }
    .tabs-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 999px; }
    .tabs {
      display: flex; gap: 8px; width: max-content; margin: 0 auto;
    }
    .tab {
      border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); color: rgba(255,255,255,.7);
      padding: 8px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s; white-space: nowrap;
    }
    .tab.active { background: var(--brand); color: white; border-color: var(--brand); }

    .stage { padding: 16px 16px 48px; display: flex; justify-content: center; align-items: flex-start; }
    .focused { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .grid-view { display: none; }
    body.mode-grid .focused { display: none; }
    body.mode-grid .grid-view { display: block; }
    .grid-wrap {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; max-width: 1700px; margin: 0 auto; padding: 8px 16px 48px;
    }
    .grid-item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .grid-item .label { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.8); text-align: center; }

    .phone {
      width: min(300px, 82vw);
      aspect-ratio: 390 / 844;
      background: #0b0f19;
      border-radius: 40px;
      padding: 10px;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.08), inset 0 0 0 1px rgba(0,0,0,.4);
      position: relative;
      transition: transform .3s ease;
    }
    .phone:hover { transform: translateY(-4px); }
    .phone::before {
      content: ""; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 38%; height: 26px; background: #000; border-radius: 0 0 18px 18px; z-index: 3;
    }
    .phone::after {
      content: ""; position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      width: 34%; height: 4px; background: rgba(255,255,255,.25); border-radius: 999px; z-index: 3;
    }
    .screen {
      width: 100%; height: 100%; border-radius: 32px; overflow: hidden; background: var(--cream);
      position: relative; display: flex; align-items: center; justify-content: center;
    }
    .screen svg { width: 100%; height: 100%; display: block; }
    .placeholder {
      color: var(--muted); font-size: 13px; text-align: center; padding: 16px;
    }
    .focused .phone { width: min(340px, 86vw); }
    .caption {
      text-align: center; color: rgba(255,255,255,.6); font-size: 13px; max-width: 460px;
    }
    .caption strong { color: #fff; }
    .footer-note {
      text-align: center; padding: 24px; color: rgba(255,255,255,.35); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
</head>

        <p>Fechou o Carrinho · Design System</p>
      </div>
    </div>
    <div class="controls">
      <span class="badge">Tokens oficiais</span>
      <span class="badge accent" id="countBadge">10 telas</span>
      <div class="toggle" role="tablist">
        <button id="btnFocused" class="active" type="button">Focado</button>

      </div>
    </div>

    <section class="grid-view" id="gridView">

  </main>

    <circle cx="17" cy="19" r="1.6" fill="#6B7280"/>
    <text x="0" y="46" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#6B7280">Carrinho</text>
  </g>
  <g transform="translate(320,778)">
    <circle cx="12" cy="8" r="4" fill="#1B8C42"/>
    <path d="M4 21 C4 16 8 14 12 14 C16 14 20 16 20 21" fill="#1B8C42"/>
    <text x="2" y="46" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#1B8C42">Perfil</text>
  </g>
</svg></template>

<script>
    const SCREENS = [
      { id: "home", label: "Home / Lista", file: "mockup_01_home_dashboard.svg", title: "Home / Lista de Compras", desc: "Lista de compras com orçamento, categorias, fotos de produtos e total em tempo real.", category: "Compras & OCR" },
      { id: "scanner", label: "Scanner OCR", file: "mockup_02_scanner_ocr.svg", title: "Scanner OCR de Gôndola", desc: "Leitura instantânea de etiquetas de preço, 100% offline.", category: "Compras & OCR" },
      { id: "total", label: "Total sem Sustos", file: "mockup_03_carrinho_fechado.svg", title: "Total sem Sustos (Carrinho Fechado)", desc: "Resumo final da compra com economia e compartilhamento.", category: "Compras & OCR" },
      { id: "compare", label: "Comparador", file: "mockup_04_comparador_mercados.svg", title: "Comparador de Supermercados", desc: "Compare preços do mesmo item em diferentes mercados.", category: "Compras & OCR" },
      { id: "widgets", label: "Widgets Android", file: "mockup_05_widgets_android.svg", title: "Widgets Android", desc: "Widgets de home screen: total, lista e atalho de scanner.", category: "Widgets" },
      { id: "listas", label: "Aba Listas", file: "mockup_06_aba_listas.svg", title: "Aba de Listas", desc: "Gerenciamento das listas de compras ativas e histórico.", category: "Listas & Perfil" },
      { id: "perfil", label: "Aba Perfil", file: "mockup_07_aba_perfil.svg", title: "Aba de Perfil", desc: "Perfil do usuário, preferências e atalhos.", category: "Listas & Perfil" },
      { id: "mercados", label: "Perfil Mercados", file: "mockup_08_perfil_mercados.svg", title: "Perfil · Mercados", desc: "Mercados favoritos e configuração de lojas.", category: "Listas & Perfil" },
      { id: "historico", label: "Perfil Histórico", file: "mockup_09_perfil_historico.svg", title: "Perfil · Histórico", desc: "Histórico de compras e gastos.", category: "Listas & Perfil" },
      { id: "config", label: "Perfil Configurações", file: "mockup_10_perfil_configuracoes.svg", title: "Perfil · Configurações", desc: "Configurações do app e preferências.", category: "Listas & Perfil" },
    ];

    const FILTERS = ["Todas", "Compras & OCR", "Listas & Perfil", "Widgets"];

    const INLINE = {};
    function loadInline() {
      FILTERS; // noop
      document.querySelectorAll('template[id^="tpl-"]').forEach(t => {
        const key = t.id.replace('tpl-', '');
        // map file-based id to screen id
      });
    }

    // Map template id -> screen id (template ids use screen id)
    function tplIdFor(screenId) { return 'tpl-' + screenId; }

    // Build INLINE from templates when available
    SCREENS.forEach(s => {
      const t = document.getElementById(tplIdFor(s.id));
      if (t) INLINE[s.id] = t.innerHTML;
    });

    let current = 0;
    let mode = 'focused';
    let activeFilter = 'Todas';

    function filteredScreens() {
      if (activeFilter === 'Todas') return SCREENS;
      return SCREENS.filter(s => s.category === activeFilter);
    }

    function ensureCurrentVisible() {
      const fs = filteredScreens();
      if (!fs.find(s => s.id === SCREENS[current].id)) {
        const first = fs[0];
        current = SCREENS.indexOf(first);
      }
    }

    function loadScreenInto(containerId, screenIdx) {
      const s = SCREENS[screenIdx];
      const el = document.getElementById(containerId);
      if (!el) return;
      if (INLINE[s.id]) {
        el.innerHTML = INLINE[s.id];
      } else {
        el.innerHTML = '<div class="placeholder">Carregando ' + s.label + '…</div>';
      }
      fetch(s.file).then(r => { if (!r.ok) throw new Error('nf'); return r.text(); })
        .then(txt => { if (txt && txt.includes('<svg')) el.innerHTML = txt; })
        .catch(() => {
          if (!INLINE[s.id]) el.innerHTML = '<div class="placeholder">Tela em preparação: ' + s.label + '</div>';
        });
    }

    function renderFilters() {
      const el = document.getElementById('filters');
      el.innerHTML = FILTERS.map(f => `<button class="pill ${f===activeFilter?'active':''}" data-f="${f}" type="button">${f}</button>`).join('');
      el.querySelectorAll('.pill').forEach(b => b.addEventListener('click', () => {
        activeFilter = b.dataset.f;
        ensureCurrentVisible();
        renderFilters();
        renderFocused();
        if (mode === 'grid') renderGrid();
      }));
    }

    function renderFocused() {
      ensureCurrentVisible();
      loadScreenInto('focusedScreen', current);
      const fs = filteredScreens();
      const tabs = document.getElementById('focusedTabs');
      tabs.innerHTML = fs.map(s => {
        const idx = SCREENS.indexOf(s);
        return `<button class="tab ${idx===current?'active':''}" data-i="${idx}" type="button">${s.label}</button>`;
      }).join('');
      tabs.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
        current = +b.dataset.i;
        renderFocused();
      }));
      const s = SCREENS[current];
      document.getElementById('focusedCaption').innerHTML = `<strong>${s.title}</strong><br/>${s.desc}`;
      // scroll active tab into view
      const activeTab = tabs.querySelector('.tab.active');
      if (activeTab) activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    function renderGrid() {
      const wrap = document.getElementById('gridWrap');
      const fs = filteredScreens();
      wrap.innerHTML = fs.map(s => {
        const idx = SCREENS.indexOf(s);
        return `<div class="grid-item">
          <div class="phone" data-screen="${s.id}">
            <div class="screen" id="gscreen-${idx}"></div>
          </div>
          <div class="label">${s.label}</div>
        </div>`;
      }).join('');
      fs.forEach(s => {
        const idx = SCREENS.indexOf(s);
        loadScreenInto(`gscreen-${idx}`, idx);
      });
    }

    document.getElementById('btnFocused').addEventListener('click', () => {
      mode = 'focused';
      document.body.classList.remove('mode-grid');
      document.body.classList.add('mode-focused');
      document.getElementById('btnFocused').classList.add('active');
      document.getElementById('btnGrid').classList.remove('active');
      renderFocused();
    });
    document.getElementById('btnGrid').addEventListener('click', () => {
      mode = 'grid';
      document.body.classList.remove('mode-focused');
      document.body.classList.add('mode-grid');
      document.getElementById('btnGrid').classList.add('active');
      document.getElementById('btnFocused').classList.remove('active');
      renderGrid();
    });

    document.body.classList.add('mode-focused');
    renderFilters();
    renderFocused();
  </script>
</body>
</html>
