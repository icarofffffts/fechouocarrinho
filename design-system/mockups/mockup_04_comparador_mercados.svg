<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cmpHeader" x1="0" y1="44" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B8C42"/>
      <stop offset="100%" stop-color="#146B32"/>
    </linearGradient>
    <filter id="cmpCard" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" std-deviation="8" flood-color="#111827" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#FFF8F0"/>

  <!-- Status bar -->
  <text x="20" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827">9:41</text>
  <g transform="translate(300, 14)">
    <rect x="0" y="2" width="18" height="10" rx="2" fill="none" stroke="#111827" stroke-width="1.2"/>
    <rect x="2" y="4" width="12" height="6" rx="1" fill="#111827"/>
    <rect x="18" y="5" width="2" height="4" rx="1" fill="#111827"/>
  </g>
  <g transform="translate(326, 14)">
    <path d="M0 12 L4 8 L8 10 L12 6 L16 4" stroke="#111827" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(348, 14)">
    <rect x="0" y="4" width="3" height="8" rx="1" fill="#111827"/>
    <rect x="5" y="2" width="3" height="10" rx="1" fill="#111827"/>
    <rect x="10" y="0" width="3" height="12" rx="1" fill="#111827"/>
  </g>

  <!-- Header -->
  <rect y="44" width="390" height="100" fill="url(#cmpHeader)"/>
  <text x="20" y="82" font-family="Nunito, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5" fill="white">Comparador de Mercados</text>
  <text x="20" y="102" font-family="Inter, sans-serif" font-size="12" fill="white" fill-opacity="0.85">Arroz integral 5kg · mesmo item, 3 lojas</text>
  <rect x="250" y="68" width="120" height="28" rx="14" fill="white" fill-opacity="0.18"/>
  <text x="262" y="87" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="white">Atualizado hoje</text>

  <!-- Item selector -->
  <rect x="20" y="160" width="350" height="46" rx="14" fill="white" filter="url(#cmpCard)"/>
  <text x="40" y="188" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#111827">🌾 Arroz integral 5kg</text>
  <text x="350" y="188" font-family="Inter, sans-serif" font-size="11" fill="#6B7280" text-anchor="end">trocar item ▾</text>

  <!-- Market comparison cards -->
  <!-- Market 1 (cheapest) -->
  <rect x="20" y="224" width="350" height="120" rx="20" fill="white" filter="url(#cmpCard)"/>
  <rect x="20" y="224" width="6" height="120" rx="3" fill="#1B8C42"/>
  <text x="40" y="252" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1B8C42">Supermercados BH</text>
  <rect x="260" y="236" width="96" height="22" rx="11" fill="#1B8C42" fill-opacity="0.12"/>
  <text x="308" y="252" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#1B8C42" text-anchor="middle">mais barato</text>
  <text x="40" y="290" font-family="Nunito, sans-serif" font-size="30" font-weight="800" letter-spacing="-1" fill="#111827">R$ 24,90</text>
  <text x="40" y="312" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">por unidade · 5km de distância</text>
  <rect x="40" y="322" width="200" height="8" rx="4" fill="#EAE5DC"/>
  <rect x="40" y="322" width="200" height="8" rx="4" fill="#1B8C42"/>
  <text x="250" y="330" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#1B8C42">economia R$ 4,00</text>

  <!-- Market 2 -->
  <rect x="20" y="360" width="350" height="110" rx="20" fill="white" filter="url(#cmpCard)"/>
  <rect x="20" y="360" width="6" height="110" rx="3" fill="#FF6B00"/>
  <text x="40" y="388" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#FF6B00">Mercado Central</text>
  <text x="40" y="426" font-family="Nunito, sans-serif" font-size="26" font-weight="800" letter-spacing="-1" fill="#111827">R$ 27,50</text>
  <text x="40" y="446" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">por unidade · 2,3km de distância</text>
  <rect x="40" y="456" width="200" height="8" rx="4" fill="#EAE5DC"/>
  <rect x="40" y="456" width="170" height="8" rx="4" fill="#FF6B00"/>
  <text x="250" y="464" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#FF6B00">+ R$ 2,60</text>

  <!-- Market 3 -->
  <rect x="20" y="486" width="350" height="110" rx="20" fill="white" filter="url(#cmpCard)"/>
  <rect x="20" y="486" width="6" height="110" rx="3" fill="#6B7280"/>
  <text x="40" y="514" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#6B7280">Atacadão</text>
  <text x="40" y="552" font-family="Nunito, sans-serif" font-size="26" font-weight="800" letter-spacing="-1" fill="#111827">R$ 28,90</text>
  <text x="40" y="572" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">por unidade · 8km de distância</text>
  <rect x="40" y="582" width="200" height="8" rx="4" fill="#EAE5DC"/>
  <rect x="40" y="582" width="150" height="8" rx="4" fill="#6B7280"/>
  <text x="250" y="590" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#6B7280">+ R$ 4,00</text>

  <!-- Summary -->
  <rect x="20" y="616" width="350" height="96" rx="20" fill="#1B8C42" fill-opacity="0.08"/>
  <text x="40" y="642" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1B8C42">economia máxima</text>
  <text x="40" y="676" font-family="Nunito, sans-serif" font-size="30" font-weight="800" letter-spacing="-1" fill="#1B8C42">R$ 4,00</text>
  <text x="40" y="696" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">comprando no Supermercados BH</text>

  <!-- CTA -->
  <rect x="20" y="730" width="350" height="48" rx="24" fill="#FF6B00"/>
  <text x="195" y="760" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">Adicionar ao carrinho no BH</text>

  <!-- Bottom nav -->
  <rect y="796" width="390" height="48" fill="white"/>
  <line x1="0" y1="796" x2="390" y2="796" stroke="#111827" stroke-opacity="0.08" stroke-width="1"/>
  <g transform="translate(40, 806)">
    <text x="0" y="18" font-size="14">🏠</text>
    <text x="-2" y="34" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#6B7280">Home</text>
  </g>
  <g transform="translate(110, 806)">
    <text x="0" y="18" font-size="14">📋</text>
    <text x="-2" y="34" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#6B7280">Lista</text>
  </g>
  <g transform="translate(175, 798)">
    <circle cx="20" cy="20" r="22" fill="#FF6B00"/>
    <text x="20" y="27" font-size="16" text-anchor="middle" fill="white">📷</text>
  </g>
  <g transform="translate(256, 806)">
    <text x="0" y="18" font-size="14">🛒</text>
    <text x="-4" y="34" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#6B7280">Carrinho</text>
  </g>
  <g transform="translate(326, 806)">
    <text x="0" y="18" font-size="14">👤</text>
    <text x="-4" y="34" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#6B7280">Perfil</text>
  </g>
</svg>
