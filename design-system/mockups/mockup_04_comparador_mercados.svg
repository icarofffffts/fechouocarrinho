  <text x="62" y="742" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#FF6B00">Dica</text>
  <text x="40" y="762" font-family="Inter, sans-serif" font-size="11" fill="#111827">Comprando no BH você economiza R$ 22,40 vs. Mart Minas.</text>

  <!-- Bottom button -->
  <rect x="20" y="790" width="350" height="44" rx="22" fill="#1B8C42"/>
  <text x="195" y="817" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">Usar lista no Supermercados BH</text>
