    <text x="0" y="40" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#6B7280">EPA</text>
    <rect x="40" y="28" width="216" height="16" rx="8" fill="#6B7280" fill-opacity="0.4"/>
    <text x="262" y="40" font-family="Nunito, sans-serif" font-size="11" font-weight="800" fill="#6B7280">204,20</text>
    <text x="0" y="66" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#6B7280">Mart</text>
    <rect x="40" y="54" width="224" height="16" rx="8" fill="#6B7280" fill-opacity="0.4"/>
    <text x="270" y="66" font-family="Nunito, sans-serif" font-size="11" font-weight="800" fill="#6B7280">211,80</text>
