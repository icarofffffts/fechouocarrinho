  </defs>

  <rect width="390" height="844" fill="url(#acBg)"/>

  <!-- Status bar -->
  <text x="24" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827">9:41</text>
  <g transform="translate(300,14)">
