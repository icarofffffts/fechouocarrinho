<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="acBg" x1="0" y1="0" x2="0" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#F7F2EB"/>
    </linearGradient>
    <filter id="acCard" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#111827" flood-opacity="0.06"/>
    </filter>
    <filter id="acBtnGlow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1B8C42" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="url(#acBg)"/>

  <!-- Status Bar -->
  <text x="28" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827">9:41</text>
  <g transform="translate(306, 19)">
    <rect x="0" y="2" width="18" height="10" rx="3" fill="none" stroke="#111827" stroke-width="1.2"/>
    <rect x="2" y="4" width="12" height="6" rx="1.5" fill="#111827"/>
    <rect x="18" y="5" width="2" height="4" rx="1" fill="#111827"/>
  </g>
  <g transform="translate(332, 19)">
    <path d="M0 11 L3 7 L7 9 L11 4 L15 2" stroke="#111827" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(352, 19)">
    <rect x="0" y="6" width="3" height="6" rx="1" fill="#111827"/>
    <rect x="5" y="3" width="3" height="9" rx="1" fill="#111827"/>
    <rect x="10" y="0" width="3" height="12" rx="1" fill="#111827"/>
  </g>

  <!-- Top Bar: Back Button -->
  <g transform="translate(24, 52)">
    <circle cx="18" cy="18" r="18" fill="white" filter="url(#acCard)"/>
    <path d="M21 12 L15 18 L21 24" stroke="#1B8C42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- App Brand Icon -->
  <g transform="translate(159, 86)">
    <rect width="72" height="72" rx="22" fill="#1B8C42" filter="url(#acBtnGlow)"/>
    <g transform="translate(6, 6) scale(1.5)">
      <path d="M7.5 9.8H10C12 9.8 13.6 11.1 14 13L14.4 14.8H26.5C27.2 14.8 27.8 15.1 28.3 15.6L33.2 20.2C33.8 20.8 33.8 21.7 33.2 22.3L28.3 26.9C27.8 27.4 27.2 27.7 26.5 27.7H16.4C14.8 27.7 13.5 26.6 13.2 25.1L10.9 14.4C10.7 13.6 10.3 13.1 9.5 13.1H7.5C6.5 13.1 5.7 12.4 5.7 11.4C5.7 10.5 6.5 9.8 7.5 9.8Z" fill="white"/>
      <path d="M15.5 20.7L18.2 23.3L23 18.2" stroke="#1B8C42" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="28.4" cy="21.25" r="1.65" fill="#FF6B00"/>
      <circle cx="17" cy="31.15" r="1.8" fill="white"/>
      <circle cx="25.6" cy="31.15" r="1.8" fill="white"/>
    </g>
  </g>

  <!-- Header Titles -->
  <text x="195" y="184" font-family="Nunito, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#111827" text-anchor="middle">Criar Conta (Opcional)</text>
  <text x="195" y="206" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">Sincronize com a família e salve suas listas</text>
  <text x="195" y="224" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">na nuvem. Ou use 100% offline.</text>

  <!-- Google Button (Balanced Layout) -->
  <rect x="32" y="252" width="326" height="50" rx="16" fill="white" filter="url(#acCard)"/>
  <g transform="translate(108, 267)">
    <circle cx="10" cy="10" r="10" fill="#F4F4F5"/>
    <text x="10" y="14" font-family="Nunito, sans-serif" font-size="12" font-weight="800" fill="#4285F4" text-anchor="middle">G</text>
    <text x="26" y="14" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827">Continuar com Google</text>
  </g>

  <!-- Divider -->
  <g transform="translate(32, 322)">
    <line x1="0" y1="0" x2="135" y2="0" stroke="#EAE5DC" stroke-width="1.2"/>
    <text x="163" y="4" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#9CA3AF" text-anchor="middle">ou com e-mail</text>
    <line x1="191" y1="0" x2="326" y2="0" stroke="#EAE5DC" stroke-width="1.2"/>
  </g>

  <!-- Form: Email Field -->
  <text x="36" y="354" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#4B5563">E-mail</text>
  <rect x="32" y="364" width="326" height="48" rx="14" fill="white" stroke="#EAE5DC" stroke-width="1.5"/>
  <g transform="translate(48, 380)">
    <rect x="0" y="1" width="16" height="12" rx="2" fill="none" stroke="#9CA3AF" stroke-width="1.4"/>
    <path d="M0 2 L8 8 L16 2" stroke="#9CA3AF" stroke-width="1.4" fill="none"/>
  </g>
  <text x="74" y="394" font-family="Inter, sans-serif" font-size="14" fill="#111827">maria.silva@email.com</text>

  <!-- Form: Password Field -->
  <text x="36" y="434" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#4B5563">Senha</text>
  <rect x="32" y="444" width="326" height="48" rx="14" fill="white" stroke="#EAE5DC" stroke-width="1.5"/>
  <g transform="translate(48, 460)">
    <rect x="2" y="5" width="13" height="9" rx="2" fill="none" stroke="#9CA3AF" stroke-width="1.4"/>
    <path d="M5 5 V3.5 C5 1.8 6.5 0.5 8.5 0.5 C10.5 0.5 12 1.8 12 3.5 V5" stroke="#9CA3AF" stroke-width="1.4" fill="none"/>
  </g>
  <text x="74" y="474" font-family="Inter, sans-serif" font-size="16" letter-spacing="2" fill="#111827">••••••••</text>
  <!-- Eye icon -->
  <g transform="translate(324, 462)">
    <path d="M0 6 C0 6 4 0 10 0 C16 0 20 6 20 6 C20 6 16 12 10 12 C4 12 0 6 0 6 Z" fill="none" stroke="#9CA3AF" stroke-width="1.4"/>
    <circle cx="10" cy="6" r="2.5" fill="#9CA3AF"/>
  </g>

  <!-- Primary CTA: Criar Conta -->
  <rect x="32" y="512" width="326" height="50" rx="25" fill="#1B8C42" filter="url(#acBtnGlow)"/>
  <text x="195" y="543" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">Criar Conta Gratuita</text>

  <!-- Secondary Non-Friction Button: Pular por enquanto / 100% Offline (ZERO SOBREPOSIÇÃO) -->
  <rect x="32" y="576" width="326" height="50" rx="25" fill="#FFF7ED" stroke="#FF6B00" stroke-width="1.8"/>
  <g transform="translate(80, 591)">
    <!-- Shield / Offline check icon -->
    <path d="M8 0 L16 3.5 V9 C16 13.5 12.5 17 8 18 C3.5 17 0 13.5 0 9 V3.5 L8 0 Z" fill="#FF6B00"/>
    <path d="M4.5 9 L7 11.5 L12 5.5" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Button text cleanly offset -->
    <text x="24" y="14" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FF6B00">Pular e Usar 100% Offline</text>
  </g>

  <!-- Privacy terms -->
  <text x="195" y="654" font-family="Inter, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="middle">Ao continuar você concorda com os Termos de Uso</text>
  <text x="195" y="670" font-family="Inter, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="middle">e a Política de Privacidade.</text>

  <!-- Bottom Link: Already have account -->
  <g transform="translate(32, 716)">
    <rect width="326" height="42" rx="12" fill="white" fill-opacity="0.6"/>
    <text x="163" y="26" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1B8C42" text-anchor="middle">Já tem uma conta? Entrar</text>
  </g>

  <!-- Android Navigation Bar (Gesture Pill) -->
  <rect x="145" y="826" width="100" height="4" rx="2" fill="#111827" fill-opacity="0.3"/>
</svg>