  <text x="195" y="200" font-family="Nunito, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#111827" text-anchor="middle">Criar Conta (Opcional)</text>
  <text x="195" y="224" font-family="Inter, sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">Sincronize com a família e salve suas listas</text>
  <text x="195" y="242" font-family="Inter, sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">na nuvem. Ou use 100% offline.</text>

