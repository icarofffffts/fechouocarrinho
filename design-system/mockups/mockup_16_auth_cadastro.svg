    <path d="M0 4 L9 11 L18 4" stroke="#6B7280" stroke-width="1.4" fill="none"/>
  </g>
  <text x="84" y="419" font-family="Inter, sans-serif" font-size="14" fill="#111827">maria.silva@email.com</text>

  <!-- Password field -->
  <text x="40" y="462" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280">Senha</text>
  <rect x="40" y="472" width="310" height="50" rx="14" fill="white" stroke="#111827" stroke-opacity="0.12" stroke-width="1.5"/>
  <g transform="translate(56,486)">
    <rect x="2" y="6" width="14" height="10" rx="2" fill="none" stroke="#6B7280" stroke-width="1.4"/>
    <path d="M5 6 V4 C5 1.8 6.8 0 9 0 C11.2 0 13 1.8 13 4 V6" stroke="#6B7280" stroke-width="1.4" fill="none"/>
  </g>
  <text x="84" y="503" font-family="Inter, sans-serif" font-size="14" fill="#111827">••••••••</text>
  <g transform="translate(324,486)">
