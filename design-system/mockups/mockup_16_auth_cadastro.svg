      <path d="M3 7 L6 10 L12 4" stroke="#FF6B00" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="195" y="640" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">Pular por enquanto · Usar 100% Offline</text>

  <!-- Footer -->
  <text x="195" y="690" font-family="Inter, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Ao continuar você concorda com os Termos de Uso</text>
  <text x="195" y="708" font-family="Inter, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">e a Política de Privacidade.</text>

  <text x="195" y="760" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#1B8C42" text-anchor="middle">Já tem conta? Entrar</text>
