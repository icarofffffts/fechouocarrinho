<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="viewBg" x1="0" y1="0" x2="390" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="sheetShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-4" std-deviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Camera viewfinder background -->
  <rect width="390" height="844" fill="url(#viewBg)"/>

  <!-- Status bar (light) -->
  <text x="20" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="white">9:41</text>
  <g transform="translate(300, 14)">
    <rect x="0" y="2" width="18" height="10" rx="2" fill="none" stroke="white" stroke-width="1.2"/>
    <rect x="2" y="4" width="12" height="6" rx="1" fill="white"/>
    <rect x="18" y="5" width="2" height="4" rx="1" fill="white"/>
  </g>
  <g transform="translate(326, 14)">
    <path d="M0 12 L4 8 L8 10 L12 6 L16 4" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(348, 14)">
    <rect x="0" y="4" width="3" height="8" rx="1" fill="white"/>
    <rect x="5" y="2" width="3" height="10" rx="1" fill="white"/>
    <rect x="10" y="0" width="3" height="12" rx="1" fill="white"/>
  </g>

  <!-- Top bar -->
  <g transform="translate(20, 56)">
    <circle cx="16" cy="16" r="16" fill="white" fill-opacity="0.12"/>
    <text x="10" y="22" font-size="16" fill="white">✕</text>
  </g>
  <text x="195" y="76" font-family="Nunito, sans-serif" font-size="18" font-weight="800" fill="white" text-anchor="middle">Escanear preço</text>
  <g transform="translate(338, 56)">
    <circle cx="16" cy="16" r="16" fill="white" fill-opacity="0.12"/>
    <text x="10" y="22" font-size="14" fill="white">⚡</text>
  </g>

  <!-- Offline badge -->
  <rect x="120" y="92" width="150" height="26" rx="13" fill="#1B8C42"/>
  <text x="132" y="110" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="white">✓ 100% Offline</text>

  <!-- Viewfinder frame -->
  <rect x="30" y="140" width="330" height="220" rx="20" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Corner brackets green -->
  <g stroke="#1B8C42" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M46 156 L46 186 M46 156 L76 156"/>
    <path d="M344 156 L344 186 M344 156 L314 156"/>
    <path d="M46 344 L46 314 M46 344 L76 344"/>
    <path d="M344 344 L344 314 M344 344 L314 344"/>
  </g>

  <!-- Scanning line -->
  <line x1="46" y1="250" x2="344" y2="250" stroke="#FF6B00" stroke-width="2" stroke-opacity="0.9"/>
  <rect x="46" y="246" width="298" height="8" fill="#FF6B00" fill-opacity="0.15"/>

  <!-- Simulated shelf label inside viewfinder -->
  <g transform="translate(70, 180)">
    <rect width="250" height="120" rx="12" fill="white" fill-opacity="0.92"/>
    <text x="16" y="30" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#6B7280">Supermercados BH</text>
    <text x="16" y="58" font-family="Nunito, sans-serif" font-size="18" font-weight="800" fill="#111827">Arroz Tio João 5kg</text>
    <text x="16" y="92" font-family="Nunito, sans-serif" font-size="26" font-weight="800" fill="#FF6B00">R$ 28,90</text>
    <text x="16" y="110" font-family="Inter, sans-serif" font-size="9" fill="#6B7280">preço por unidade</text>
  </g>

  <!-- Detection highlight box -->
  <rect x="84" y="258" width="120" height="34" rx="6" fill="none" stroke="#1B8C42" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="90" y="280" font-family="monospace" font-size="11" font-weight="700" fill="#1B8C42">R$ 28,90 ✓</text>

  <!-- Hint text -->
  <text x="195" y="380" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="white" fill-opacity="0.8" text-anchor="middle">Posicione a etiqueta no centro do quadro</text>
  <text x="195" y="400" font-family="Inter, sans-serif" font-size="11" fill="white" fill-opacity="0.5" text-anchor="middle">A leitura é instantânea e 100% offline</text>

  <!-- Bottom sheet -->
  <g filter="url(#sheetShadow)">
    <rect y="440" width="390" height="404" rx="28" fill="white"/>
  </g>
  <rect x="175" y="452" width="40" height="4" rx="2" fill="#EAE5DC"/>

  <text x="32" y="490" font-family="Nunito, sans-serif" font-size="20" font-weight="800" fill="#111827">Preço detectado</text>
  <text x="32" y="512" font-family="Inter, sans-serif" font-size="12" fill="#6B7280">Confirme ou edite antes de adicionar</text>

  <!-- Detected product card -->
  <rect x="32" y="530" width="326" height="92" rx="20" fill="#FFF8F0"/>
  <rect x="48" y="546" width="48" height="48" rx="12" fill="#EAE5DC"/>
  <text x="62" y="578" font-size="22">🌾</text>
  <text x="108" y="566" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#111827">Arroz Tio João 5kg</text>
  <text x="108" y="586" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">Supermercados BH · 1 un</text>
  <text x="326" y="578" font-family="Nunito, sans-serif" font-size="22" font-weight="800" fill="#FF6B00" text-anchor="end">R$ 28,90</text>

  <!-- Price input -->
  <text x="32" y="646" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280">Preço unitário</text>
  <rect x="32" y="656" width="326" height="48" rx="14" fill="white" stroke="#111827" stroke-opacity="0.12" stroke-width="1.5"/>
  <text x="48" y="686" font-family="Nunito, sans-serif" font-size="18" font-weight="800" fill="#111827">R$ 28,90</text>
  <text x="340" y="686" font-family="Inter, sans-serif" font-size="11" fill="#6B7280" text-anchor="end">editar</text>

  <!-- Quantity -->
  <text x="32" y="720" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6B7280">Quantidade</text>
  <g transform="translate(32, 730)">
    <rect width="44" height="40" rx="12" fill="#EAE5DC"/>
    <text x="16" y="26" font-family="Nunito, sans-serif" font-size="18" font-weight="800" fill="#111827">−</text>
  </g>
  <rect x="84" y="730" width="60" height="40" rx="12" fill="white" stroke="#111827" stroke-opacity="0.12" stroke-width="1.5"/>
  <text x="114" y="756" font-family="Nunito, sans-serif" font-size="18" font-weight="800" fill="#111827" text-anchor="middle">1</text>
  <g transform="translate(152, 730)">
    <rect width="44" height="40" rx="12" fill="#1B8C42"/>
    <text x="16" y="26" font-family="Nunito, sans-serif" font-size="18" font-weight="800" fill="white">+</text>
  </g>

  <!-- Buttons -->
  <rect x="32" y="782" width="156" height="44" rx="22" fill="#EAE5DC"/>
  <text x="110" y="809" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Editar</text>

  <rect x="202" y="782" width="156" height="44" rx="22" fill="#FF6B00"/>
  <text x="280" y="809" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">Confirmar</text>
</svg>